<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Quiz Scoreboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-900 min-h-screen text-white flex flex-col overflow-hidden">

  <!-- ========== HEADER ========== -->
  <header class="bg-slate-800 border-b border-slate-700 py-2 px-3 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <!-- Logo on the far left -->
      <!-- Put your logo.png file inside an /images folder -->
      <img id="teamLogo" 
           src="images/team-logo.png" 
           alt="Team Missions Logo" 
           class="team-logo">

      <!-- Title in the center -->
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m-4-8h8" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 8h8v12H8z" opacity="0.4"/>
        </svg>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
         Prestige College | Bible Quiz Scoreboard
        </h1>
      </div>

      <!-- Settings on the far right -->
      <button id="settings-btn"
              class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-3 py-1.5 rounded-lg border border-slate-500 transition text-sm">
        ⚙️ Settings
      </button>
    </div>
  </header>

  <!-- ========== SETUP PANEL ========== -->
  <section class="bg-slate-800/80 border-b border-slate-700 py-2 px-3">
    <div class="max-w-7xl mx-auto">
      <p class="text-xs text-slate-300 mb-1 font-medium">Select competing houses:</p>
      <div class="flex flex-wrap gap-3 sm:gap-4" id="house-toggles">
        <!-- Checkboxes generated by JS -->
      </div>
    </div>
  </section>

  <!-- ========== TIMERS ========== -->
  <div class="py-2 flex justify-center gap-3 flex-wrap">
    <button id="timer5-btn"
            title="Start 5-second timer (then auto-starts 25s)"
            class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 active:scale-95 text-sky-300 font-bold px-4 py-2 rounded-xl border-2 border-sky-500/60 shadow transition text-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="9" />
        <path stroke-linecap="round" d="M12 7v5l3 2" />
      </svg>
      <span id="timer5-display" class="text-xl tabular-nums min-w-[2ch] font-mono">5</span>
    </button>

    <button id="timer-btn"
            title="Start 25-second timer"
            class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 active:scale-95 text-amber-300 font-bold px-5 py-2 rounded-xl border-2 border-amber-500/60 shadow transition text-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="9" />
        <path stroke-linecap="round" d="M12 7v5l3 2" />
      </svg>
      <span id="timer-display" class="text-xl tabular-nums min-w-[2.5ch] font-mono">25</span>
    </button>
  </div>

  <!-- ========== SCOREBOARD ========== -->
  <main class="flex-1 flex flex-col sm:flex-row gap-2 p-2 overflow-hidden" id="scoreboard">
    <!-- Columns injected by JS -->
  </main>

  <!-- ========== BUTTONS ========== -->
  <div class="py-2 flex justify-center gap-3 flex-wrap bg-slate-900">
    <button id="scores-btn"
            class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white font-bold text-base px-8 py-2 rounded-full shadow border-2 border-emerald-400 tracking-wide">
      SCORES
    </button>

    <button id="reset-btn"
            class="bg-rose-600 hover:bg-rose-500 active:scale-95 transition text-white font-bold text-base px-6 py-2 rounded-full shadow border-2 border-rose-400 tracking-wide">
      Reset Game
    </button>
  </div>

  <!-- ========== LEADERBOARD MODAL ========== -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
    <div class="bg-white text-slate-900 rounded-2xl shadow-2xl w-11/12 max-w-md mx-auto overflow-hidden">
      <div class="bg-slate-800 text-white py-3 px-5 flex justify-between items-center">
        <h2 class="text-lg font-bold">🏆 Leaderboard</h2>
        <button id="close-modal" class="text-2xl leading-none hover:text-red-400 transition">&times;</button>
      </div>
      <div id="leaderboard-list" class="p-5 space-y-2">
        <!-- Ranked list injected by JS -->
      </div>
    </div>
  </div>

  <!-- ========== QUIZED OUT MODAL ========== -->
  <div id="quizout-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
    <div class="bg-white text-slate-900 rounded-2xl shadow-2xl w-11/12 max-w-sm mx-auto overflow-hidden text-center">
      <div class="bg-amber-500 text-white py-3 px-5">
        <h2 class="text-lg font-bold">🎉 Quiz Out!</h2>
      </div>
      <div class="p-5">
        <p id="quizout-message" class="text-base font-medium mb-4"></p>
        <button id="quizout-ok" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-2 rounded-full transition">
          OK
        </button>
      </div>
    </div>
  </div>

  <!-- ========== TIEBREAKER MODAL ========== -->
  <div id="tiebreaker-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
    <div class="bg-white text-slate-900 rounded-2xl shadow-2xl w-11/12 max-w-lg mx-auto overflow-hidden">
      <div class="bg-indigo-700 text-white py-3 px-5 flex justify-between items-center">
        <h2 class="text-lg font-bold">⚔️ Tiebreaker</h2>
        <button id="close-tiebreaker" class="text-2xl leading-none hover:text-red-300 transition">&times;</button>
      </div>
      <div class="p-4">
        <p class="text-center text-slate-600 mb-1 text-sm" id="tb-question-label">Question 1 of 3</p>
        <p class="text-center font-semibold mb-3 text-xs">Correct = +10 &nbsp;|&nbsp; Incorrect = −10</p>
        
        <div id="tb-houses" class="space-y-2 mb-3">
          <!-- Tied houses injected here -->
        </div>

        <div class="text-center text-xs text-slate-600 font-medium" id="tb-scores"></div>
      </div>
    </div>
  </div>

  <!-- ========== SETTINGS MODAL ========== -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
    <div class="bg-white text-slate-900 rounded-2xl shadow-2xl w-11/12 max-w-sm mx-auto overflow-hidden">
      <div class="bg-slate-800 text-white py-3 px-5 flex justify-between items-center">
        <h2 class="text-lg font-bold">⚙️ Settings</h2>
        <button id="close-settings" class="text-2xl leading-none hover:text-red-400 transition">&times;</button>
      </div>
      <div class="p-5 space-y-4">
        <div>
          <label class="block font-semibold mb-1 text-sm">Number of Seats per House</label>
          <select id="seats-select" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-base font-medium">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
          </select>
        </div>
        <p class="text-xs text-slate-500">Changing the number of seats will reset all scores.</p>
        <button id="save-settings" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition">
          Save Settings
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
