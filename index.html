<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Quiz Scoreboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Digital score font */
    .digital-score {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      letter-spacing: -0.05em;
      text-shadow: 0 0 8px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, color 0.2s ease;
    }
    .score-pop {
      animation: scorePop 0.35s ease;
    }
    @keyframes scorePop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    /* Modal backdrop */
    .modal-backdrop {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    /* Timer button pulse while running */
    .timer-running {
      animation: timerPulse 1s ease-in-out infinite;
    }
    @keyframes timerPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55); }
      50%      { box-shadow: 0 0 0 12px rgba(251, 191, 36, 0); }
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-white flex flex-col">

  <!-- ========== HEADER ========== -->
  <header class="bg-slate-800 border-b border-slate-700 py-4 px-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-center gap-3">
      <!-- Simple cross / Bible icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m-4-8h8" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 8h8v12H8z" opacity="0.4"/>
      </svg>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-center">
        Prestige College Bible Quiz Scoreboard
      </h1>
    </div>
  </header>

  <!-- ========== SETUP PANEL ========== -->
  <section class="bg-slate-800/80 border-b border-slate-700 py-3 px-4">
    <div class="max-w-7xl mx-auto">
      <p class="text-sm text-slate-300 mb-2 font-medium">Select competing houses:</p>
      <div class="flex flex-wrap gap-4 sm:gap-6" id="house-toggles">
        <!-- Checkboxes generated by JS -->
      </div>
    </div>
  </section>

  <!-- ========== TIMERS (just above the houses) ========== -->
  <div class="pt-4 pb-1 flex justify-center gap-4 flex-wrap">
    <!-- 5-second timer -->
    <button id="timer5-btn"
            title="Start 5-second timer (then auto-starts 30s)"
            class="flex items-center gap-3
                   bg-slate-700 hover:bg-slate-600 active:scale-95
                   text-sky-300 font-bold px-5 py-3 rounded-2xl
                   border-2 border-sky-500/60 shadow-lg transition text-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="9" />
        <path stroke-linecap="round" d="M12 7v5l3 2" />
      </svg>
      <span id="timer5-display" class="text-2xl tabular-nums min-w-[2ch] font-mono">5</span>
    </button>

    <!-- 30-second timer -->
    <button id="timer-btn"
            title="Start 30-second timer"
            class="flex items-center gap-3
                   bg-slate-700 hover:bg-slate-600 active:scale-95
                   text-amber-300 font-bold px-6 py-3 rounded-2xl
                   border-2 border-amber-500/60 shadow-lg transition text-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="9" />
        <path stroke-linecap="round" d="M12 7v5l3 2" />
      </svg>
      <span id="timer-display" class="text-2xl tabular-nums min-w-[2.8ch] font-mono">30</span>
    </button>
  </div>

  <!-- ========== SCOREBOARD COLUMNS ========== -->
  <main class="flex-1 flex flex-col sm:flex-row gap-3 p-3 sm:p-4 overflow-x-auto" id="scoreboard">
    <!-- Columns injected here -->
  </main>

  <!-- ========== SCORES BUTTON ========== -->
  <div class="p-4 flex justify-center bg-slate-900">
    <button id="scores-btn"
            class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition
                   text-white font-bold text-lg px-10 py-3 rounded-full shadow-lg
                   border-2 border-emerald-400 tracking-wide">
      SCORES
    </button>
  </div>

  <!-- ========== LEADERBOARD MODAL ========== -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
    <div class="bg-white text-slate-900 rounded-2xl shadow-2xl w-11/12 max-w-md mx-auto overflow-hidden">
      <div class="bg-slate-800 text-white py-4 px-6 flex justify-between items-center">
        <h2 class="text-xl font-bold">🏆 Leaderboard</h2>
        <button id="close-modal" class="text-2xl leading-none hover:text-red-400 transition">&times;</button>
      </div>
      <div id="leaderboard-list" class="p-6 space-y-3">
        <!-- Ranked list injected here -->
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       CONFIG – edit house names / colors here
       ============================================================ */
    const HOUSES = [
      {
        id: 'white',
        name: 'White House',
        bg: 'bg-white',
        text: 'text-slate-800',
        headerBg: 'bg-slate-200',
        scoreBg: 'bg-slate-700',
        scoreText: 'text-white',
        btnClass: 'bg-white border-slate-300 text-red-600 hover:bg-slate-50',
        accent: '#e5e7eb'
      },
      {
        id: 'green',
        name: 'Green House',
        bg: 'bg-[#22c55e]',
        text: 'text-white',
        headerBg: 'bg-green-600',
        scoreBg: 'bg-slate-800',
        scoreText: 'text-white',
        btnClass: 'bg-green-400 border-green-300 text-green-900 hover:bg-green-300',
        accent: '#22c55e'
      },
      {
        id: 'yellow',
        name: 'Yellow House',
        bg: 'bg-[#eab308]',
        text: 'text-slate-900',
        headerBg: 'bg-yellow-500',
        scoreBg: 'bg-slate-800',
        scoreText: 'text-yellow-300',
        btnClass: 'bg-yellow-300 border-yellow-200 text-yellow-900 hover:bg-yellow-200',
        accent: '#eab308'
      },
      {
        id: 'red',
        name: 'Red House',
        bg: 'bg-[#ef4444]',
        text: 'text-white',
        headerBg: 'bg-red-600',
        scoreBg: 'bg-slate-800',
        scoreText: 'text-red-300',
        btnClass: 'bg-red-400 border-red-300 text-red-900 hover:bg-red-300',
        accent: '#ef4444'
      }
    ];

    /* ============================================================
       STATE
       ============================================================ */
    const state = {
      scores: {},
      active: {}          // which houses are currently shown
    };

    // Initialise
    HOUSES.forEach(h => {
      state.scores[h.id] = 0;
      state.active[h.id] = true;   // all active by default
    });

    /* ============================================================
       DOM REFERENCES
       ============================================================ */
    const scoreboardEl   = document.getElementById('scoreboard');
    const togglesEl      = document.getElementById('house-toggles');
    const modalEl        = document.getElementById('modal');
    const leaderboardEl  = document.getElementById('leaderboard-list');
    const scoresBtn      = document.getElementById('scores-btn');
    const closeModalBtn  = document.getElementById('close-modal');

    // Timer elements
    const timerBtn       = document.getElementById('timer-btn');
    const timerDisplay   = document.getElementById('timer-display');
    const timer5Btn      = document.getElementById('timer5-btn');
    const timer5Display  = document.getElementById('timer5-display');

    /* ============================================================
       TIMER + SOUND
       ============================================================ */
    let timerInterval = null;
    let timer5Interval = null;
    let remaining = 30;
    let remaining5 = 5;
    const TIMER_DURATION = 30;
    const TIMER5_DURATION = 5;

    // Create a simple beep using Web Audio API
    function playBeep({ frequency = 880, duration = 0.15, type = 'sine', volume = 0.3 } = {}) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.value = frequency;
        gain.gain.value = volume;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        // Fade out
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Audio not available', e);
      }
    }

    function playStartSound() {
      // Short high beep
      playBeep({ frequency: 1046, duration: 0.12, type: 'sine', volume: 0.35 });
    }

    function playTimeoutSound() {
      // Longer lower alarm-like sound (two tones)
      playBeep({ frequency: 440, duration: 0.25, type: 'square', volume: 0.4 });
      setTimeout(() => {
        playBeep({ frequency: 330, duration: 0.4, type: 'square', volume: 0.4 });
      }, 280);
    }

    function updateTimerDisplay() {
      timerDisplay.textContent = remaining;
    }

    function updateTimer5Display() {
      timer5Display.textContent = remaining5;
    }

    function stopTimer(reset = true) {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timerBtn.classList.remove('timer-running', 'bg-amber-600', 'text-white', 'border-amber-300');
      timerBtn.classList.add('bg-slate-700', 'text-amber-300', 'border-amber-500/60');
      if (reset) {
        remaining = TIMER_DURATION;
        updateTimerDisplay();
      }
    }

    function stopTimer5(reset = true) {
      if (timer5Interval) {
        clearInterval(timer5Interval);
        timer5Interval = null;
      }
      timer5Btn.classList.remove('timer-running', 'bg-sky-600', 'text-white', 'border-sky-300');
      timer5Btn.classList.add('bg-slate-700', 'text-sky-300', 'border-sky-500/60');
      if (reset) {
        remaining5 = TIMER5_DURATION;
        updateTimer5Display();
      }
    }

    function startTimer() {
      // Cancel if already running
      if (timerInterval) {
        stopTimer(true);
        return;
      }

      // Stop the 5s timer if it is running
      stopTimer5(true);

      remaining = TIMER_DURATION;
      updateTimerDisplay();
      playStartSound();

      timerBtn.classList.add('timer-running', 'bg-amber-600', 'text-white', 'border-amber-300');
      timerBtn.classList.remove('bg-slate-700', 'text-amber-300', 'border-amber-500/60');

      timerInterval = setInterval(() => {
        remaining--;
        updateTimerDisplay();

        if (remaining <= 0) {
          stopTimer(false);
          playTimeoutSound();
          // Flash the display briefly
          timerDisplay.textContent = '0';
          setTimeout(() => {
            remaining = TIMER_DURATION;
            updateTimerDisplay();
          }, 800);
        }
      }, 1000);
    }

    function startTimer5() {
      // Cancel if already running
      if (timer5Interval) {
        stopTimer5(true);
        return;
      }

      // Stop the 30s timer if it is running
      stopTimer(true);

      remaining5 = TIMER5_DURATION;
      updateTimer5Display();
      playStartSound();

      timer5Btn.classList.add('timer-running', 'bg-sky-600', 'text-white', 'border-sky-300');
      timer5Btn.classList.remove('bg-slate-700', 'text-sky-300', 'border-sky-500/60');

      timer5Interval = setInterval(() => {
        remaining5--;
        updateTimer5Display();

        if (remaining5 <= 0) {
          stopTimer5(false);
          playTimeoutSound();
          // Flash the display briefly, then auto-start the 30s timer
          timer5Display.textContent = '0';
          setTimeout(() => {
            remaining5 = TIMER5_DURATION;
            updateTimer5Display();
            // Automatically start the 30-second timer
            startTimer();
          }, 600);
        }
      }, 1000);
    }

    timerBtn.addEventListener('click', startTimer);
    timer5Btn.addEventListener('click', startTimer5);

    /* ============================================================
       RENDER TOGGLES
       ============================================================ */
    function renderToggles() {
      togglesEl.innerHTML = '';
      HOUSES.forEach(h => {
        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 cursor-pointer select-none';
        label.innerHTML = `
          <input type="checkbox" data-house="${h.id}"
                 class="w-5 h-5 rounded accent-emerald-500"
                 ${state.active[h.id] ? 'checked' : ''}>
          <span class="font-medium">${h.name}</span>
        `;
        togglesEl.appendChild(label);
      });

      // Attach change listeners
      togglesEl.querySelectorAll('input').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const id = e.target.dataset.house;
          state.active[id] = e.target.checked;
          renderScoreboard();
        });
      });
    }

    /* ============================================================
       RENDER SCOREBOARD COLUMNS
       ============================================================ */
    function renderScoreboard() {
      const activeHouses = HOUSES.filter(h => state.active[h.id]);
      scoreboardEl.innerHTML = '';

      if (activeHouses.length === 0) {
        scoreboardEl.innerHTML = `
          <div class="flex-1 flex items-center justify-center text-slate-400 text-xl">
            Select at least one house above
          </div>`;
        return;
      }

      activeHouses.forEach(h => {
        const col = document.createElement('div');
        col.className = `
          flex-1 min-w-[160px] max-w-xs mx-auto
          ${h.bg} ${h.text} rounded-2xl shadow-xl
          flex flex-col overflow-hidden
        `;
        col.dataset.house = h.id;

        col.innerHTML = `
          <!-- Header banner -->
          <div class="${h.headerBg} py-3 text-center font-bold text-lg tracking-wide shadow-inner">
            ${h.name}
          </div>

          <!-- Huge digital score -->
          <div class="flex-1 flex items-center justify-center py-8">
            <div id="score-${h.id}"
                 class="digital-score text-6xl sm:text-7xl md:text-8xl
                        ${h.scoreBg} ${h.scoreText}
                        px-6 py-3 rounded-xl shadow-inner min-w-[3.5ch] text-center">
              ${state.scores[h.id]}
            </div>
          </div>

          <!-- Buttons -->
          <div class="p-4 space-y-3">
            <button data-pts="20" data-house="${h.id}"
                    class="w-full py-3 rounded-xl font-bold text-lg border-2 shadow
                           ${h.btnClass} active:scale-95 transition">
              +20
            </button>
            <button data-pts="10" data-house="${h.id}"
                    class="w-full py-3 rounded-xl font-bold text-lg border-2 shadow
                           ${h.btnClass} active:scale-95 transition">
              +10
            </button>
            <button data-pts="-10" data-house="${h.id}"
                    class="w-full py-3 rounded-xl font-bold text-lg border-2 shadow
                           ${h.btnClass} active:scale-95 transition">
              −10
            </button>
          </div>
        `;
        scoreboardEl.appendChild(col);
      });

      // Attach button listeners
      scoreboardEl.querySelectorAll('button[data-pts]').forEach(btn => {
        btn.addEventListener('click', () => {
          const houseId = btn.dataset.house;
          const pts = parseInt(btn.dataset.pts, 10);
          updateScore(houseId, pts);
        });
      });
    }

    /* ============================================================
       UPDATE SCORE + ANIMATION
       ============================================================ */
    function updateScore(houseId, delta) {
      // Allow negative scores
      state.scores[houseId] = state.scores[houseId] + delta;
      const el = document.getElementById(`score-${houseId}`);
      if (el) {
        el.textContent = state.scores[houseId];
        el.classList.remove('score-pop');
        // force reflow so animation can restart
        void el.offsetWidth;
        el.classList.add('score-pop');
      }
    }

    /* ============================================================
       LEADERBOARD MODAL
       ============================================================ */
    function showLeaderboard() {
      const ranked = HOUSES
        .filter(h => state.active[h.id])
        .map(h => ({ ...h, score: state.scores[h.id] }))
        .sort((a, b) => b.score - a.score);

      const medals = ['🥇', '🥈', '🥉', '4️⃣'];

      leaderboardEl.innerHTML = ranked.length
        ? ranked.map((h, i) => `
            <div class="flex items-center justify-between p-3 rounded-xl
                        ${i === 0 ? 'bg-amber-100 border-2 border-amber-400' : 'bg-slate-100'}">
              <div class="flex items-center gap-3">
                <span class="text-2xl">${medals[i] || (i + 1)}</span>
                <span class="font-semibold text-lg">${h.name}</span>
              </div>
              <span class="font-bold text-xl tabular-nums">${h.score}</span>
            </div>
          `).join('')
        : '<p class="text-center text-slate-500">No houses selected</p>';

      modalEl.classList.remove('hidden');
      modalEl.classList.add('flex');
    }

    function hideModal() {
      modalEl.classList.add('hidden');
      modalEl.classList.remove('flex');
    }

    /* ============================================================
       EVENT LISTENERS
       ============================================================ */
    scoresBtn.addEventListener('click', showLeaderboard);
    closeModalBtn.addEventListener('click', hideModal);
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) hideModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideModal();
    });

    /* ============================================================
       INIT
       ============================================================ */
    renderToggles();
    renderScoreboard();
  </script>
</body>
</html>
